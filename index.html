<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>">
<title>AI 1-Week Sprint</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap">
<style>
  :root {
    --paper: #FBFAF6;
    --surface: #FFFFFF;
    --ink: #22262E;
    --muted: #5D6472;
    --indigo: #2A456E;
    --indigo-deep: #1C3053;
    --indigo-tint: #EEF1F6;
    --accent: #A96F1C;
    --accent-tint: #F7EEDD;
    --line: #E4E1D7;
    --chip-bg: #FFFFFF;
    --chip-on: #2A456E;
    --chip-on-text: #FFFFFF;
    --ok: #2E6B45;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #14171D;
      --surface: #1C2027;
      --ink: #E9E7E0;
      --muted: #9AA1AD;
      --indigo: #93B2E0;
      --indigo-deep: #B7CDEE;
      --indigo-tint: #232B38;
      --accent: #D9A24B;
      --accent-tint: #2E2617;
      --line: #2D323C;
      --chip-bg: #1C2027;
      --chip-on: #93B2E0;
      --chip-on-text: #14171D;
      --ok: #7CBF95;
    }
  }
  :root[data-theme="dark"] {
    --paper: #14171D;
    --surface: #1C2027;
    --ink: #E9E7E0;
    --muted: #9AA1AD;
    --indigo: #93B2E0;
    --indigo-deep: #B7CDEE;
    --indigo-tint: #232B38;
    --accent: #D9A24B;
    --accent-tint: #2E2617;
    --line: #2D323C;
    --chip-bg: #1C2027;
    --chip-on: #93B2E0;
    --chip-on-text: #14171D;
    --ok: #7CBF95;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
    font-size: 16px;
    line-height: 1.85;
    -webkit-font-smoothing: antialiased;
  }
  main { max-width: 720px; margin: 0 auto; padding: 0 24px 96px; }

  .topbar {
    display: flex; justify-content: flex-end;
    padding-top: 24px;
  }
  .lang-toggle {
    display: inline-flex;
    border: 1px solid var(--line);
    border-radius: 999px;
    overflow: hidden;
    background: var(--surface);
  }
  .lang-toggle button {
    font: inherit;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.03em;
    padding: 5px 16px;
    border: none;
    background: transparent;
    color: var(--muted);
    cursor: pointer;
  }
  .lang-toggle button[aria-pressed="true"] {
    background: var(--indigo);
    color: var(--chip-on-text);
  }

  .eyebrow {
    font-size: 12px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--accent);
    font-weight: 700;
    margin: 0 0 14px;
  }
  header.hero { padding: 40px 0 20px; border-bottom: 1px solid var(--line); }
  .badge {
    display: inline-block;
    background: var(--accent-tint);
    color: var(--accent);
    font-size: 13px;
    font-weight: 700;
    padding: 4px 14px;
    border-radius: 999px;
    margin-bottom: 20px;
    letter-spacing: 0.04em;
  }
  h1 {
    font-family: "Shippori Mincho", "Hiragino Mincho ProN", serif;
    font-size: clamp(30px, 5.5vw, 42px);
    font-weight: 700;
    line-height: 1.35;
    margin: 0 0 18px;
    color: var(--indigo-deep);
    text-wrap: balance;
  }
  .lede { font-size: 17px; color: var(--ink); max-width: 40em; margin: 0 0 10px; }
  .lede-sub { color: var(--muted); font-size: 14.5px; margin: 0; }

  section { padding: 48px 0 8px; }
  h2 {
    font-family: "Shippori Mincho", "Hiragino Mincho ProN", serif;
    font-size: 23px;
    font-weight: 600;
    color: var(--indigo-deep);
    margin: 0 0 20px;
    text-wrap: balance;
  }

  .steps { display: grid; gap: 14px; margin: 0; padding: 0; list-style: none; counter-reset: step; }
  .steps li {
    counter-increment: step;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 18px 20px 18px 62px;
    position: relative;
  }
  .steps li::before {
    content: counter(step);
    position: absolute;
    left: 20px; top: 20px;
    width: 28px; height: 28px;
    border-radius: 50%;
    background: var(--indigo-tint);
    color: var(--indigo);
    font-family: "Shippori Mincho", serif;
    font-weight: 700;
    font-size: 15px;
    display: flex; align-items: center; justify-content: center;
  }
  .steps b { display: block; font-size: 16px; margin-bottom: 2px; }
  .steps span { color: var(--muted); font-size: 14.5px; line-height: 1.7; display: block; }

  .scope { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  @media (max-width: 560px) { .scope { grid-template-columns: 1fr; } }
  .scope-card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 18px 20px;
  }
  .scope-card h3 { margin: 0 0 10px; font-size: 15px; letter-spacing: 0.02em; }
  .scope-card.yes h3 { color: var(--ok); }
  .scope-card.no h3 { color: var(--muted); }
  .scope-card ul { margin: 0; padding-left: 1.2em; color: var(--muted); font-size: 14.5px; line-height: 1.9; }

  /* ---- booking form ---- */
  .book {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 28px 26px 30px;
    margin-top: 8px;
  }
  .book .hours {
    color: var(--muted); font-size: 14px; margin: 4px 0 22px;
  }
  .field-label {
    display: block;
    font-weight: 700;
    font-size: 14px;
    margin: 22px 0 8px;
  }
  .field-label .opt { font-weight: 400; color: var(--muted); font-size: 12.5px; margin-left: 6px; }
  .dates {
    display: flex; gap: 8px; overflow-x: auto; padding-bottom: 6px;
    scrollbar-width: thin;
  }
  .date-chip, .time-chip {
    font: inherit;
    font-variant-numeric: tabular-nums;
    background: var(--chip-bg);
    border: 1px solid var(--line);
    color: var(--ink);
    border-radius: 8px;
    padding: 8px 14px;
    cursor: pointer;
    white-space: nowrap;
    font-size: 14.5px;
    transition: border-color .12s ease;
  }
  .date-chip small { display: block; color: var(--muted); font-size: 11.5px; line-height: 1.3; }
  .date-chip:hover, .time-chip:hover { border-color: var(--indigo); }
  .date-chip[aria-pressed="true"], .time-chip[aria-pressed="true"] {
    background: var(--chip-on);
    border-color: var(--chip-on);
    color: var(--chip-on-text);
  }
  .date-chip[aria-pressed="true"] small { color: var(--chip-on-text); opacity: .8; }
  .times { display: flex; gap: 8px; flex-wrap: wrap; }

  input[type="text"], input[type="email"], input[type="url"], textarea {
    width: 100%;
    font: inherit;
    font-size: 15px;
    color: var(--ink);
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 10px 12px;
  }
  textarea { min-height: 84px; resize: vertical; }
  input:focus, textarea:focus, button:focus-visible {
    outline: 2px solid var(--indigo);
    outline-offset: 1px;
  }
  .submit {
    margin-top: 28px;
    width: 100%;
    font: inherit;
    font-weight: 700;
    font-size: 16px;
    background: var(--indigo);
    color: var(--chip-on-text);
    border: none;
    border-radius: 10px;
    padding: 14px;
    cursor: pointer;
  }
  .submit:hover { background: var(--indigo-deep); }
  .form-error { color: #B4462F; font-size: 14px; margin: 12px 0 0; display: none; }

  .done { display: none; }
  .done h3 { font-family: "Shippori Mincho", serif; color: var(--indigo-deep); font-size: 20px; margin: 0 0 10px; }
  .done p { color: var(--muted); font-size: 14.5px; }
  .done textarea { min-height: 180px; font-size: 13px; font-family: ui-monospace, monospace; }
  .copy-btn {
    font: inherit; font-size: 14px; font-weight: 700;
    background: var(--indigo-tint); color: var(--indigo);
    border: 1px solid var(--line); border-radius: 8px;
    padding: 8px 16px; cursor: pointer; margin-top: 10px;
  }

  footer {
    border-top: 1px solid var(--line);
    margin-top: 56px; padding-top: 24px;
    color: var(--muted); font-size: 13px;
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<main>
  <div class="topbar">
    <div class="lang-toggle" role="group" aria-label="Language">
      <button type="button" id="lang-ja" aria-pressed="true">日本語</button>
      <button type="button" id="lang-en" aria-pressed="false">English</button>
    </div>
  </div>

  <header class="hero">
    <span class="badge" data-i18n="badge"></span>
    <h1 data-i18n="h1"></h1>
    <p class="lede" data-i18n="lede"></p>
    <p class="lede-sub" data-i18n="ledeSub"></p>
  </header>

  <section>
    <p class="eyebrow">How it works</p>
    <h2 data-i18n="howH2"></h2>
    <ol class="steps">
      <li>
        <b data-i18n="s1b"></b>
        <span data-i18n="s1s"></span>
      </li>
      <li>
        <b data-i18n="s2b"></b>
        <span data-i18n="s2s"></span>
      </li>
      <li>
        <b data-i18n="s3b"></b>
        <span data-i18n="s3s"></span>
      </li>
    </ol>
  </section>

  <section>
    <p class="eyebrow">Scope</p>
    <h2 data-i18n="scopeH2"></h2>
    <div class="scope">
      <div class="scope-card yes">
        <h3 data-i18n="inclH3"></h3>
        <ul>
          <li data-i18n="incl1"></li>
          <li data-i18n="incl2"></li>
          <li data-i18n="incl3"></li>
          <li data-i18n="incl4"></li>
        </ul>
      </div>
      <div class="scope-card no">
        <h3 data-i18n="exclH3"></h3>
        <ul>
          <li data-i18n="excl1"></li>
          <li data-i18n="excl2"></li>
          <li data-i18n="excl3"></li>
        </ul>
      </div>
    </div>
  </section>

  <section id="booking">
    <p class="eyebrow">Book a session</p>
    <h2 data-i18n="bookH2"></h2>
    <div class="book">
      <form id="form" novalidate>
        <p class="hours" data-i18n="hours"></p>

        <label class="field-label" data-i18n="lblDate"></label>
        <div class="dates" id="dates" role="group"></div>

        <label class="field-label" data-i18n="lblTime"></label>
        <div class="times" id="times" role="group"></div>

        <label class="field-label" for="f-name" data-i18n="lblName"></label>
        <input type="text" id="f-name" autocomplete="name">

        <label class="field-label" for="f-biz" data-i18n="lblBiz"></label>
        <input type="text" id="f-biz" autocomplete="organization">

        <label class="field-label" for="f-link"><span data-i18n="lblLink"></span><span class="opt" data-i18n="opt"></span></label>
        <input type="url" id="f-link" placeholder="https://">

        <label class="field-label" for="f-email" data-i18n="lblEmail"></label>
        <input type="email" id="f-email" autocomplete="email">

        <label class="field-label" for="f-pain"><span data-i18n="lblPain"></span><span class="opt" data-i18n="opt"></span></label>
        <textarea id="f-pain" data-i18n-ph="phPain"></textarea>

        <label class="field-label" for="f-note"><span data-i18n="lblNote"></span><span class="opt" data-i18n="opt"></span></label>
        <textarea id="f-note"></textarea>

        <p class="form-error" id="err" data-i18n="err"></p>
        <button type="submit" class="submit" data-i18n="submit"></button>
      </form>

      <div class="done" id="done">
        <h3 data-i18n="doneH3"></h3>
        <p id="done-msg"></p>
        <p data-i18n="copyHint"></p>
        <textarea id="summary" readonly></textarea>
        <button class="copy-btn" id="copy" data-i18n="copyBtn"></button>
      </div>
    </div>
  </section>

  <footer>
    <p data-i18n="footer"></p>
  </footer>
</main>

<script>
(function () {
  // Set this to the inbox that receives applications. Leave "" to show copy-only confirmation.
  var BOOKING_EMAIL = "REDACTED_EMAIL";

  var I18N = {

      incl4: "費用は一切かかりません",
      exclH3: "含まれないもの",
      excl1: "完成品・製品版の開発",
      excl2: "複数のお困りごとへの同時対応",
      excl3: "継続的な保守・サポート",
      bookH2: "ヒアリングを予約する",
      hours: "平日（月〜金） 18:30 / 19:30 / 20:30 / 21:30 開始 ・ 各60分 ・ 日本時間",
      lblDate: "ご希望の日にち",
      lblTime: "ご希望の時間",
      lblName: "お名前",
      lblBiz: "事業名・店舗名",
      lblLink: "WebサイトやSNSのリンク",
      lblEmail: "メールアドレス",
      lblPain: "すでに分かっているお困りごと",
      lblNote: "その他、伝えておきたいこと",
      opt: "任意",
      phPain: "例：予約の電話対応に毎日1時間かかっている、口コミの返信が追いつかない など",

      submit: "この内容で申し込む",
      doneH3: "お申し込みありがとうございます",
      doneMail: "申込内容を記載したメールが開きます。そのまま送信してください。送信後、24時間以内にカレンダー招待をお送りします。",
      doneCopy: "下記の申込内容をコピーして、ご案内したメールアドレスまたはLINEにお送りください。確認後、カレンダー招待をお送りします。",
      copyHint: "メールが開かない場合は、下記をコピーしてお送りください。",
      copyBtn: "内容をコピー",
      copied: "コピーしました",
      copyFail: "選択してコピーしてください",
      footer: "AI 1-Week Sprint ・ 先着10社限定の無料パイロットプログラムです。ヒアリングでAIによる解決が難しいと判断した場合は、その旨を正直にお伝えします。",
      datesAria: "日にちを選択",
      timesAria: "時間を選択",
      wdays: ["日", "月", "火", "水", "木", "金", "土"],
      wdaySuffix: "曜",
      timeSuffix: "〜",
      sumTitle: "【AI 1-Week Sprint 申込】",
      sumWhen: "希望日時", sumDur: "（60分・日本時間）",
      sumName: "お名前", sumBiz: "事業名", sumLink: "リンク",
      sumEmail: "メール", sumPain: "お困りごと", sumNote: "その他",
      mailSubject: "【AI Sprint 申込】"
    },
    en: {
      badge: "First 10 businesses ・ Free",
      h1: "The task that eats your time every day — turned into an AI tool in 3 days.",
      lede: "In a one-hour interview we identify the single most time-consuming task in your business. Within about 3 days (1 week at most), we build a working prototype and show it to you in action.",
      ledeSub: "AI 1-Week Sprint — 日本の中小企業向け無料パイロットプログラム",
      howH2: "How it works",
      s1b: "Interview (60 min, online or in person)",
      s1s: "We walk through how your business and money flow day to day, and list every pain point together. No jargon.",
      s2b: "Build (about 3 days, 1 week at most)",
      s2s: "From the list, we pick one problem AI can genuinely solve and build a working tool for it.",
      s3b: "Demo (session 2)",
      s3s: "We run the finished tool live, on your real work, so you can see exactly what it does.",
      scopeH2: "What this is — honestly",
      inclH3: "Included",
      incl1: "A 60-minute interview",
      incl2: "A working prototype for one pain point",
      incl3: "A live demo session",
      incl4: "Completely free of charge",
      exclH3: "Not included",
      excl1: "Production-grade, finished software",
      excl2: "Multiple problems at once",
      excl3: "Ongoing maintenance or support",
      bookH2: "Book your interview",
      hours: "Weekdays (Mon–Fri), starting 18:30 / 19:30 / 20:30 / 21:30 ・ 60 min ・ Japan time (JST)",
      lblDate: "Preferred date",
      lblTime: "Preferred time",
      lblName: "Your name",
      lblBiz: "Business / shop name",
      lblLink: "Website or social media link",
      lblEmail: "Email address",
      lblPain: "Pain points you already know about",
      lblNote: "Anything else we should know",
      opt: "optional",
      phPain: "e.g. Phone reservations take an hour every day; can't keep up with review replies",
      err: "Please fill in the date, time, your name, business name, and email address.",
      submit: "Submit application",
      doneH3: "Thank you for applying",
      doneMail: "An email with your application details will open — just hit send. You'll receive a calendar invite within 24 hours.",
      doneCopy: "Please copy the application below and send it to us by email or LINE. Once confirmed, you'll receive a calendar invite.",
      copyHint: "If your email app didn't open, copy the text below and send it to us.",
      copyBtn: "Copy details",
      copied: "Copied",
      copyFail: "Please select and copy manually",
      footer: "AI 1-Week Sprint ・ A free pilot program limited to the first 10 businesses. If we conclude in the interview that AI can't genuinely solve your problem, we'll tell you so honestly.",
      datesAria: "Choose a date",
      timesAria: "Choose a time",
      wdays: ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"],
      wdaySuffix: "",
      timeSuffix: "",
      sumTitle: "[AI 1-Week Sprint — Application]",
      sumWhen: "Preferred slot", sumDur: " (60 min, JST)",
      sumName: "Name", sumBiz: "Business", sumLink: "Link",
      sumEmail: "Email", sumPain: "Pain points", sumNote: "Notes",
      mailSubject: "[AI Sprint application] "
    }
  };

  var SLOTS = ["18:30", "19:30", "20:30", "21:30"];
  var lang = "ja";
  try { if (localStorage.getItem("sprint-lang") === "en") lang = "en"; } catch (e) {}

  var selDate = null, selTime = null;
  var datesEl = document.getElementById("dates");
  var timesEl = document.getElementById("times");

  // next 15 weekdays starting tomorrow (JST assumed: audience is local)
  var dateList = [];
  var d = new Date();
  while (dateList.length < 15) {
    d.setDate(d.getDate() + 1);
    var day = d.getDay();
    if (day === 0 || day === 6) continue;
    dateList.push({ label: (d.getMonth() + 1) + "/" + d.getDate(), year: d.getFullYear(), day: day });
  }

  function t(key) { return I18N[lang][key]; }

  function renderChips() {
    datesEl.innerHTML = "";
    datesEl.setAttribute("aria-label", t("datesAria"));
    dateList.forEach(function (item) {
      var wd = t("wdays")[item.day];
      var value = item.year + "/" + item.label + " (" + wd + ")";
      var btn = document.createElement("button");
      btn.type = "button";
      btn.className = "date-chip";
      btn.dataset.value = value;
      btn.dataset.key = item.label;
      btn.setAttribute("aria-pressed", selDate && selDate.key === item.label ? "true" : "false");
      btn.innerHTML = item.label + "<small>" + wd + t("wdaySuffix") + "</small>";
      btn.addEventListener("click", function () {
        selDate = { key: item.label, value: value };
        syncPressed(datesEl, btn);
      });
      datesEl.appendChild(btn);
    });

    timesEl.innerHTML = "";
    timesEl.setAttribute("aria-label", t("timesAria"));
    SLOTS.forEach(function (slot) {
      var btn = document.createElement("button");
      btn.type = "button";
      btn.className = "time-chip";
      btn.dataset.value = slot;
      btn.setAttribute("aria-pressed", selTime === slot ? "true" : "false");
      btn.textContent = slot + t("timeSuffix");
      btn.addEventListener("click", function () {
        selTime = slot;
        syncPressed(timesEl, btn);
      });
      timesEl.appendChild(btn);
    });
  }

  function syncPressed(group, active) {
    var chips = group.querySelectorAll("[aria-pressed]");
    for (var i = 0; i < chips.length; i++) chips[i].setAttribute("aria-pressed", "false");
    active.setAttribute("aria-pressed", "true");
  }

  function applyLang() {
    document.documentElement.lang = lang;
    var els = document.querySelectorAll("[data-i18n]");
    for (var i = 0; i < els.length; i++) {
      els[i].innerHTML = t(els[i].getAttribute("data-i18n"));
    }
    var phs = document.querySelectorAll("[data-i18n-ph]");
    for (var j = 0; j < phs.length; j++) {
      phs[j].setAttribute("placeholder", t(phs[j].getAttribute("data-i18n-ph")));
    }
    if (selDate) {
      var item = null;
      for (var k = 0; k < dateList.length; k++) if (dateList[k].label === selDate.key) item = dateList[k];
      if (item) selDate.value = item.year + "/" + item.label + " (" + t("wdays")[item.day] + ")";
    }
    document.getElementById("lang-ja").setAttribute("aria-pressed", lang === "ja" ? "true" : "false");
    document.getElementById("lang-en").setAttribute("aria-pressed", lang === "en" ? "true" : "false");
    renderChips();
  }

  document.getElementById("lang-ja").addEventListener("click", function () { setLang("ja"); });
  document.getElementById("lang-en").addEventListener("click", function () { setLang("en"); });
  function setLang(next) {
    lang = next;
    try { localStorage.setItem("sprint-lang", next); } catch (e) {}
    applyLang();
  }

  document.getElementById("form").addEventListener("submit", function (e) {
    e.preventDefault();
    var name = val("f-name"), biz = val("f-biz"), link = val("f-link"),
        email = val("f-email"), pain = val("f-pain"), note = val("f-note");
    var err = document.getElementById("err");
    if (!selDate || !selTime || !name || !biz || !email || email.indexOf("@") < 1) {
      err.style.display = "block";
      return;
    }
    err.style.display = "none";

    var lines = [
      t("sumTitle"),
      "",
      t("sumWhen") + ": " + selDate.value + " " + selTime + t("sumDur"),
      t("sumName") + ": " + name,
      t("sumBiz") + ": " + biz,
      t("sumLink") + ": " + (link || "—"),
      t("sumEmail") + ": " + email,
      t("sumPain") + ": " + (pain || "—"),
      t("sumNote") + ": " + (note || "—")
    ];
    var body = lines.join("\n");

    document.getElementById("form").style.display = "none";
    var done = document.getElementById("done");
    done.style.display = "block";
    document.getElementById("summary").value = body;

    if (BOOKING_EMAIL) {
      document.getElementById("done-msg").textContent = t("doneMail");
      var subject = t("mailSubject") + biz + " — " + selDate.value + " " + selTime;
      location.href = "mailto:" + BOOKING_EMAIL +
        "?subject=" + encodeURIComponent(subject) +
        "&body=" + encodeURIComponent(body);
    } else {
      document.getElementById("done-msg").textContent = t("doneCopy");
    }
    done.scrollIntoView({ behavior: "smooth", block: "start" });
  });

  document.getElementById("copy").addEventListener("click", function () {
    var ta = document.getElementById("summary");
    ta.select();
    var self = this;
    try {
      navigator.clipboard ? navigator.clipboard.writeText(ta.value) : document.execCommand("copy");
      self.textContent = t("copied");
    } catch (e) {
      self.textContent = t("copyFail");
    }
  });

  function val(id) { return document.getElementById(id).value.trim(); }

  applyLang();
})();
</script>
</body>
</html>
