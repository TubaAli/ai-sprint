<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>">
<title>AI 1-Week Sprint</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap">
<style>
  :root {
    --paper: #FFFDF6;
    --surface: #FFFFFF;
    --ink: #242833;
    --muted: #5F6675;
    --blue: #2B6BE4;
    --blue-deep: #1E4FB0;
    --blue-tint: #E8F0FE;
    --coral: #E8603C;
    --coral-tint: #FDEBE4;
    --teal: #0F9D84;
    --teal-tint: #E2F6F1;
    --amber: #E9930C;
    --amber-tint: #FDF1DC;
    --line: #EAE6DA;
    --chip-on-text: #FFFFFF;
    --err: #C43D22;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #151924;
      --surface: #1E2330;
      --ink: #EAE9E4;
      --muted: #9BA3B2;
      --blue: #7FA7F2;
      --blue-deep: #A9C4F7;
      --blue-tint: #232E45;
      --coral: #F0876B;
      --coral-tint: #392620;
      --teal: #3FC3AB;
      --teal-tint: #17332D;
      --amber: #F2B24E;
      --amber-tint: #39301C;
      --line: #2E3442;
      --chip-on-text: #151924;
      --err: #F08A70;
    }
  }
  :root[data-theme="dark"] {
    --paper: #151924;
    --surface: #1E2330;
    --ink: #EAE9E4;
    --muted: #9BA3B2;
    --blue: #7FA7F2;
    --blue-deep: #A9C4F7;
    --blue-tint: #232E45;
    --coral: #F0876B;
    --coral-tint: #392620;
    --teal: #3FC3AB;
    --teal-tint: #17332D;
    --amber: #F2B24E;
    --amber-tint: #39301C;
    --line: #2E3442;
    --chip-on-text: #151924;
    --err: #F08A70;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
    font-size: 16px;
    line-height: 1.85;
    -webkit-font-smoothing: antialiased;
  }
  main { max-width: 780px; margin: 0 auto; padding: 0 24px 96px; }

  .topbar { display: flex; justify-content: flex-end; padding-top: 24px; }
  .lang-toggle {
    display: inline-flex;
    border: 1px solid var(--line);
    border-radius: 999px;
    overflow: hidden;
    background: var(--surface);
  }
  .lang-toggle button {
    font: inherit; font-size: 13px; font-weight: 700; letter-spacing: 0.03em;
    padding: 5px 16px; border: none; background: transparent;
    color: var(--muted); cursor: pointer;
  }
  .lang-toggle button[aria-pressed="true"] { background: var(--blue); color: var(--chip-on-text); }

  .eyebrow {
    font-size: 12px; letter-spacing: 0.18em; text-transform: uppercase;
    font-weight: 700; margin: 0 0 14px;
  }
  .eyebrow.c-blue { color: var(--blue); }
  .eyebrow.c-teal { color: var(--teal); }
  .eyebrow.c-coral { color: var(--coral); }

  header.hero {
    padding: 36px 0 36px;
    border-bottom: 1px solid var(--line);
    background:
      radial-gradient(420px 260px at 85% 10%, color-mix(in srgb, var(--amber) 14%, transparent), transparent 70%),
      radial-gradient(380px 240px at 8% 90%, color-mix(in srgb, var(--blue) 10%, transparent), transparent 70%);
    display: grid;
    grid-template-columns: 1fr 250px;
    gap: 28px;
    align-items: center;
  }
  @media (max-width: 640px) { header.hero { grid-template-columns: 1fr; } .hero-art { max-width: 240px; margin: 0 auto; } }
  .badge {
    display: inline-block;
    background: linear-gradient(100deg, var(--amber-tint), var(--coral-tint));
    color: var(--coral);
    border: 1px solid color-mix(in srgb, var(--coral) 30%, transparent);
    font-size: 13px; font-weight: 700; padding: 4px 14px;
    border-radius: 999px; margin-bottom: 20px; letter-spacing: 0.04em;
  }
  h1 {
    font-family: "Shippori Mincho", "Hiragino Mincho ProN", serif;
    font-size: clamp(28px, 5vw, 38px);
    font-weight: 700; line-height: 1.4;
    margin: 0 0 18px; color: var(--ink);
    text-wrap: balance;
  }
  h1 em { font-style: normal; color: var(--blue); }
  .lede { font-size: 16.5px; color: var(--ink); max-width: 40em; margin: 0 0 10px; }
  .lede-sub { color: var(--muted); font-size: 14px; margin: 0; }
  .hero-art svg { max-width: 100%; height: auto; display: block; }
  .spots {
    display: inline-flex; align-items: baseline; gap: 10px;
    margin-top: 20px; padding: 8px 18px 10px;
    background: var(--coral-tint);
    border: 1px solid color-mix(in srgb, var(--coral) 35%, transparent);
    border-radius: 12px;
  }
  .spots-n {
    font-family: "Shippori Mincho", serif;
    font-size: 52px; font-weight: 700; line-height: 1;
    color: var(--coral);
    font-variant-numeric: tabular-nums;
  }
  .spots-label { font-size: 14px; font-weight: 700; color: var(--coral); line-height: 1.4; }

  section { padding: 52px 0 8px; }
  h2 {
    font-family: "Shippori Mincho", "Hiragino Mincho ProN", serif;
    font-size: 23px; font-weight: 600; color: var(--ink);
    margin: 0 0 20px; text-wrap: balance;
  }

  figure.flow { margin: 0 0 26px; }
  figure.flow svg { max-width: 100%; height: auto; display: block; }
  figure.flow figcaption { font-size: 13px; color: var(--muted); text-align: center; margin-top: 4px; }

  .steps { display: grid; gap: 14px; margin: 0; padding: 0; list-style: none; }
  .steps li {
    background: var(--surface);
    border: 1px solid var(--line);
    border-top: 3px solid var(--line);
    border-radius: 12px;
    padding: 18px 20px 18px 64px;
    position: relative;
  }
  .steps li .n {
    position: absolute; left: 18px; top: 20px;
    width: 30px; height: 30px; border-radius: 50%;
    font-family: "Shippori Mincho", serif; font-weight: 700; font-size: 15px;
    display: flex; align-items: center; justify-content: center;
  }
  .steps li.st-blue  { border-top-color: var(--blue); }
  .steps li.st-amber { border-top-color: var(--amber); }
  .steps li.st-teal  { border-top-color: var(--teal); }
  .steps li.st-blue  .n { background: var(--blue-tint);  color: var(--blue); }
  .steps li.st-amber .n { background: var(--amber-tint); color: var(--amber); }
  .steps li.st-teal  .n { background: var(--teal-tint);  color: var(--teal); }
  .steps b { display: block; font-size: 16px; margin-bottom: 2px; }
  .steps span.desc { color: var(--muted); font-size: 14.5px; line-height: 1.7; display: block; }

  .scope { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  @media (max-width: 560px) { .scope { grid-template-columns: 1fr; } }
  .scope-card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 18px 20px;
  }
  .scope-card.yes { background: linear-gradient(180deg, var(--teal-tint), var(--surface) 70%); border-color: color-mix(in srgb, var(--teal) 30%, var(--line)); }
  .scope-card.no  { background: var(--surface); }
  .scope-card h3 { margin: 0 0 10px; font-size: 15px; letter-spacing: 0.02em; }
  .scope-card.yes h3 { color: var(--teal); }
  .scope-card.no h3 { color: var(--muted); }
  .scope-card ul { margin: 0; padding: 0; list-style: none; color: var(--muted); font-size: 14.5px; line-height: 1.9; }
  .scope-card li { padding-left: 1.6em; position: relative; }
  .scope-card.yes li::before {
    content: "✓"; position: absolute; left: 0; color: var(--teal); font-weight: 700;
  }
  .scope-card.no li::before {
    content: "—"; position: absolute; left: 0; color: var(--coral); font-weight: 700;
  }

  .book {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 28px 26px 30px;
    margin-top: 8px;
    box-shadow: 0 3px 0 color-mix(in srgb, var(--blue) 18%, transparent);
  }
  .book .hours {
    color: var(--blue-deep); background: var(--blue-tint);
    border-radius: 8px; padding: 8px 14px;
    font-size: 14px; margin: 4px 0 22px;
  }
  .field-label { display: block; font-weight: 700; font-size: 14px; margin: 22px 0 8px; }
  .field-label .opt { font-weight: 400; color: var(--muted); font-size: 12.5px; margin-left: 6px; }
  .dates { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 6px; scrollbar-width: thin; }
  .date-chip, .time-chip {
    font: inherit; font-variant-numeric: tabular-nums;
    background: var(--paper);
    border: 1px solid var(--line);
    color: var(--ink);
    border-radius: 8px; padding: 8px 14px;
    cursor: pointer; white-space: nowrap; font-size: 14.5px;
    transition: border-color .12s ease;
  }
  .date-chip small { display: block; color: var(--muted); font-size: 11.5px; line-height: 1.3; }
  .date-chip:hover, .time-chip:hover { border-color: var(--blue); }
  .date-chip[aria-pressed="true"], .time-chip[aria-pressed="true"] {
    background: var(--blue); border-color: var(--blue); color: var(--chip-on-text);
  }
  .date-chip[aria-pressed="true"] small { color: var(--chip-on-text); opacity: .8; }
  .times { display: flex; gap: 8px; flex-wrap: wrap; }

  input[type="text"], input[type="email"], input[type="url"], textarea {
    width: 100%; font: inherit; font-size: 15px;
    color: var(--ink); background: var(--paper);
    border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px;
  }
  textarea { min-height: 84px; resize: vertical; }
  input:focus, textarea:focus, button:focus-visible { outline: 2px solid var(--blue); outline-offset: 1px; }
  .submit {
    margin-top: 28px; width: 100%;
    font: inherit; font-weight: 700; font-size: 16px;
    background: linear-gradient(100deg, var(--blue), var(--blue-deep));
    color: var(--chip-on-text);
    border: none; border-radius: 10px; padding: 14px; cursor: pointer;
  }
  .submit:hover { filter: brightness(1.08); }
  .form-error { color: var(--err); font-size: 14px; margin: 12px 0 0; display: none; }

  .done { display: none; }
  .done h3 { font-family: "Shippori Mincho", serif; color: var(--teal); font-size: 20px; margin: 0 0 10px; }
  .done p { color: var(--muted); font-size: 14.5px; }
  .done textarea { min-height: 180px; font-size: 13px; font-family: ui-monospace, monospace; }
  .copy-btn {
    font: inherit; font-size: 14px; font-weight: 700;
    background: var(--blue-tint); color: var(--blue-deep);
    border: 1px solid var(--line); border-radius: 8px;
    padding: 8px 16px; cursor: pointer; margin-top: 10px;
  }

  footer { border-top: 1px solid var(--line); margin-top: 56px; padding-top: 24px; color: var(--muted); font-size: 13px; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<main>
  <div class="topbar">
    <div class="lang-toggle" role="group" aria-label="Language">
      <button type="button" id="lang-ja" aria-pressed="true">日本語</button>
      <button type="button" id="lang-en" aria-pressed="false">English</button>
    </div>
  </div>

  <header class="hero">
    <div>
      <span class="badge" data-i18n="badge"></span>
      <h1 data-i18n="h1"></h1>
      <p class="lede" data-i18n="lede"></p>
      <p class="lede-sub" data-i18n="ledeSub"></p>
      <div class="spots">
        <span class="spots-n" id="spots-n">10</span>
        <span class="spots-label" data-i18n="spotsLabel"></span>
      </div>
    </div>
    <div class="hero-art" aria-hidden="true">
      <svg viewBox="0 0 260 240">
        <!-- sparkles -->
        <polygon points="212,26 217,38 229,43 217,48 212,60 207,48 195,43 207,38" fill="var(--amber)"/>
        <polygon points="238,70 241,77 248,80 241,83 238,90 235,83 228,80 235,77" fill="var(--coral)"/>
        <polygon points="26,40 29,47 36,50 29,53 26,60 23,53 16,50 23,47" fill="var(--teal)"/>
        <!-- AI chat bubble -->
        <rect x="150" y="12" width="52" height="38" rx="10" fill="var(--blue)"/>
        <polygon points="164,48 176,48 162,62" fill="var(--blue)"/>
        <text x="176" y="38" text-anchor="middle" font-size="18" font-weight="700" fill="var(--paper)" font-family="'Noto Sans JP',sans-serif">AI</text>
        <!-- shop body -->
        <rect x="34" y="96" width="192" height="118" rx="6" fill="var(--surface)" stroke="var(--line)" stroke-width="2"/>
        <!-- awning stripes -->
        <rect x="26" y="76" width="208" height="22" rx="4" fill="var(--coral)"/>
        <circle cx="47"  cy="98" r="13" fill="var(--coral-tint)"/>
        <circle cx="73"  cy="98" r="13" fill="var(--coral)"/>
        <circle cx="99"  cy="98" r="13" fill="var(--coral-tint)"/>
        <circle cx="125" cy="98" r="13" fill="var(--coral)"/>
        <circle cx="151" cy="98" r="13" fill="var(--coral-tint)"/>
        <circle cx="177" cy="98" r="13" fill="var(--coral)"/>
        <circle cx="203" cy="98" r="13" fill="var(--coral-tint)"/>
        <!-- window with warm light -->
        <rect x="54" y="126" width="76" height="56" rx="5" fill="var(--amber-tint)" stroke="var(--amber)" stroke-width="2"/>
        <line x1="92" y1="126" x2="92" y2="182" stroke="var(--amber)" stroke-width="2"/>
        <line x1="54" y1="154" x2="130" y2="154" stroke="var(--amber)" stroke-width="2"/>
        <!-- door -->
        <rect x="152" y="132" width="52" height="82" rx="5" fill="var(--blue-tint)" stroke="var(--blue)" stroke-width="2"/>
        <circle cx="194" cy="174" r="3.5" fill="var(--blue)"/>
        <!-- ground -->
        <line x1="14" y1="216" x2="246" y2="216" stroke="var(--line)" stroke-width="3" stroke-linecap="round"/>
      </svg>
    </div>
  </header>

  <section>
    <p class="eyebrow c-blue">How it works</p>
    <h2 data-i18n="howH2"></h2>

    <figure class="flow">
      <svg viewBox="0 0 640 130" role="img" aria-label="Interview, then build, then demo" id="flow-svg">
        <defs>
          <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--muted)"/>
          </marker>
        </defs>
        <circle cx="110" cy="44" r="27" fill="var(--blue-tint)" stroke="var(--blue)" stroke-width="2.5"/>
        <text x="110" y="51" text-anchor="middle" font-size="19" font-weight="700" fill="var(--blue)" font-family="'Shippori Mincho',serif">1</text>
        <circle cx="320" cy="44" r="27" fill="var(--amber-tint)" stroke="var(--amber)" stroke-width="2.5"/>
        <text x="320" y="51" text-anchor="middle" font-size="19" font-weight="700" fill="var(--amber)" font-family="'Shippori Mincho',serif">2</text>
        <circle cx="530" cy="44" r="27" fill="var(--teal-tint)" stroke="var(--teal)" stroke-width="2.5"/>
        <text x="530" y="51" text-anchor="middle" font-size="19" font-weight="700" fill="var(--teal)" font-family="'Shippori Mincho',serif">3</text>
        <line x1="145" y1="44" x2="285" y2="44" stroke="var(--muted)" stroke-width="2" marker-end="url(#arw)"/>
        <line x1="355" y1="44" x2="495" y2="44" stroke="var(--muted)" stroke-width="2" marker-end="url(#arw)"/>
        <text x="215" y="32" text-anchor="middle" font-size="12" fill="var(--muted)" font-family="'Noto Sans JP',sans-serif" data-i18n="dgArrow1"></text>
        <text x="425" y="32" text-anchor="middle" font-size="12" fill="var(--muted)" font-family="'Noto Sans JP',sans-serif" data-i18n="dgArrow2"></text>
        <text x="110" y="94" text-anchor="middle" font-size="14" font-weight="700" fill="var(--ink)" font-family="'Noto Sans JP',sans-serif" data-i18n="dgN1"></text>
        <text x="110" y="114" text-anchor="middle" font-size="12" fill="var(--muted)" font-family="'Noto Sans JP',sans-serif" data-i18n="dgN1s"></text>
        <text x="320" y="94" text-anchor="middle" font-size="14" font-weight="700" fill="var(--ink)" font-family="'Noto Sans JP',sans-serif" data-i18n="dgN2"></text>
        <text x="320" y="114" text-anchor="middle" font-size="12" fill="var(--muted)" font-family="'Noto Sans JP',sans-serif" data-i18n="dgN2s"></text>
        <text x="530" y="94" text-anchor="middle" font-size="14" font-weight="700" fill="var(--ink)" font-family="'Noto Sans JP',sans-serif" data-i18n="dgN3"></text>
        <text x="530" y="114" text-anchor="middle" font-size="12" fill="var(--muted)" font-family="'Noto Sans JP',sans-serif" data-i18n="dgN3s"></text>
      </svg>
      <figcaption data-i18n="dgCap"></figcaption>
    </figure>

    <ol class="steps">
      <li class="st-blue">
        <span class="n">1</span>
        <b data-i18n="s1b"></b>
        <span class="desc" data-i18n="s1s"></span>
      </li>
      <li class="st-amber">
        <span class="n">2</span>
        <b data-i18n="s2b"></b>
        <span class="desc" data-i18n="s2s"></span>
      </li>
      <li class="st-teal">
        <span class="n">3</span>
        <b data-i18n="s3b"></b>
        <span class="desc" data-i18n="s3s"></span>
      </li>
    </ol>
  </section>

  <section>
    <p class="eyebrow c-teal">Scope</p>
    <h2 data-i18n="scopeH2"></h2>
    <div class="scope">
      <div class="scope-card yes">
        <h3 data-i18n="inclH3"></h3>
        <ul>
          <li data-i18n="incl1"></li>
          <li data-i18n="incl2"></li>
          <li data-i18n="incl3"></li>
          <li data-i18n="incl4"></li>
        </ul>
      </div>
      <div class="scope-card no">
        <h3 data-i18n="exclH3"></h3>
        <ul>
          <li data-i18n="excl1"></li>
          <li data-i18n="excl2"></li>
          <li data-i18n="excl3"></li>
        </ul>
      </div>
    </div>
  </section>

  <section id="booking">
    <p class="eyebrow c-coral">Book a session</p>
    <h2 data-i18n="bookH2"></h2>
    <div class="book">
      <form id="form" novalidate>
        <p class="hours" data-i18n="hours"></p>

        <label class="field-label" data-i18n="lblDate"></label>
        <div class="dates" id="dates" role="group"></div>

        <label class="field-label" data-i18n="lblTime"></label>
        <div class="times" id="times" role="group"></div>

        <label class="field-label" for="f-name" data-i18n="lblName"></label>
        <input type="text" id="f-name" autocomplete="name">

        <label class="field-label" for="f-biz" data-i18n="lblBiz"></label>
        <input type="text" id="f-biz" autocomplete="organization">

        <label class="field-label" for="f-link"><span data-i18n="lblLink"></span><span class="opt" data-i18n="opt"></span></label>
        <input type="url" id="f-link" placeholder="https://">

        <label class="field-label" for="f-email" data-i18n="lblEmail"></label>
        <input type="email" id="f-email" autocomplete="email">

        <label class="field-label" for="f-pain"><span data-i18n="lblPain"></span><span class="opt" data-i18n="opt"></span></label>
        <textarea id="f-pain" data-i18n-ph="phPain"></textarea>

        <label class="field-label" for="f-note"><span data-i18n="lblNote"></span><span class="opt" data-i18n="opt"></span></label>
        <textarea id="f-note"></textarea>

        <p class="form-error" id="err" data-i18n="err"></p>
        <button type="submit" class="submit" data-i18n="submit"></button>
      </form>

      <div class="done" id="done">
        <h3 data-i18n="doneH3"></h3>
        <p id="done-msg"></p>
        <div id="fallback">
          <button class="submit" id="send-mail" data-i18n="sendBtn"></button>
          <p data-i18n="copyHint"></p>
          <textarea id="summary" readonly></textarea>
          <button class="copy-btn" id="copy" data-i18n="copyBtn"></button>
        </div>
      </div>
    </div>
  </section>

  <footer>
    <p data-i18n="footer"></p>
  </footer>
</main>

<script>
(function () {
  // Set this to the inbox that receives applications. Leave "" to show copy-only confirmation.
  var BOOKING_EMAIL = "REDACTED_EMAIL";
  // Remaining free spots (out of 10). Update this number as bookings are confirmed.
  var SPOTS_LEFT = 10;

  var I18N = {
    ja: {
      badge: "先着10社限定 ・ 無料",
      h1: "毎日あなたの時間を奪っている業務を、<br><em>3日</em>でAIツールにします。",
      lede: "1時間のヒアリングで、事業のなかで最も負担になっている業務をひとつ特定。約3日（最長でも1週間）で、実際に動く試作ツール（プロトタイプ）を作ってお見せします。",
      ledeSub: "AI 1-Week Sprint — a free pilot program for small businesses in Japan.",

  var SLOTS = ["18:30", "19:30", "20:30", "21:30"];
  var lang = "ja";
  try { if (localStorage.getItem("sprint-lang") === "en") lang = "en"; } catch (e) {}

  var selDate = null, selTime = null;
  var datesEl = document.getElementById("dates");
  var timesEl = document.getElementById("times");

  // next 15 weekdays starting tomorrow (JST assumed: audience is local)
  var dateList = [];
  var d = new Date();
  while (dateList.length < 15) {
    d.setDate(d.getDate() + 1);
    var day = d.getDay();
    if (day === 0 || day === 6) continue;
    dateList.push({ label: (d.getMonth() + 1) + "/" + d.getDate(), year: d.getFullYear(), day: day });
  }

  function t(key) { return I18N[lang][key]; }

  function renderChips() {
    datesEl.innerHTML = "";
    datesEl.setAttribute("aria-label", t("datesAria"));
    dateList.forEach(function (item) {
      var wd = t("wdays")[item.day];
      var value = item.year + "/" + item.label + " (" + wd + ")";
      var btn = document.createElement("button");
      btn.type = "button";
      btn.className = "date-chip";
      btn.dataset.value = value;
      btn.dataset.key = item.label;
      btn.setAttribute("aria-pressed", selDate && selDate.key === item.label ? "true" : "false");
      btn.innerHTML = item.label + "<small>" + wd + t("wdaySuffix") + "</small>";
      btn.addEventListener("click", function () {
        selDate = { key: item.label, value: value };
        syncPressed(datesEl, btn);
      });
      datesEl.appendChild(btn);
    });

    timesEl.innerHTML = "";
    timesEl.setAttribute("aria-label", t("timesAria"));
    SLOTS.forEach(function (slot) {
      var btn = document.createElement("button");
      btn.type = "button";
      btn.className = "time-chip";
      btn.dataset.value = slot;
      btn.setAttribute("aria-pressed", selTime === slot ? "true" : "false");
      btn.textContent = slot + t("timeSuffix");
      btn.addEventListener("click", function () {
        selTime = slot;
        syncPressed(timesEl, btn);
      });
      timesEl.appendChild(btn);
    });
  }

  function syncPressed(group, active) {
    var chips = group.querySelectorAll("[aria-pressed]");
    for (var i = 0; i < chips.length; i++) chips[i].setAttribute("aria-pressed", "false");
    active.setAttribute("aria-pressed", "true");
  }

  function applyLang() {
    document.documentElement.lang = lang;
    var els = document.querySelectorAll("[data-i18n]");
    for (var i = 0; i < els.length; i++) {
      els[i].innerHTML = t(els[i].getAttribute("data-i18n"));
    }
    var phs = document.querySelectorAll("[data-i18n-ph]");
    for (var j = 0; j < phs.length; j++) {
      phs[j].setAttribute("placeholder", t(phs[j].getAttribute("data-i18n-ph")));
    }
    if (selDate) {
      var item = null;
      for (var k = 0; k < dateList.length; k++) if (dateList[k].label === selDate.key) item = dateList[k];
      if (item) selDate.value = item.year + "/" + item.label + " (" + t("wdays")[item.day] + ")";
    }
    document.getElementById("lang-ja").setAttribute("aria-pressed", lang === "ja" ? "true" : "false");
    document.getElementById("lang-en").setAttribute("aria-pressed", lang === "en" ? "true" : "false");
    renderChips();
  }

  document.getElementById("lang-ja").addEventListener("click", function () { setLang("ja"); });
  document.getElementById("lang-en").addEventListener("click", function () { setLang("en"); });
  function setLang(next) {
    lang = next;
    try { localStorage.setItem("sprint-lang", next); } catch (e) {}
    applyLang();
  }

  document.getElementById("form").addEventListener("submit", function (e) {
    e.preventDefault();
    var name = val("f-name"), biz = val("f-biz"), link = val("f-link"),
        email = val("f-email"), pain = val("f-pain"), note = val("f-note");
    var err = document.getElementById("err");
    if (!selDate || !selTime || !name || !biz || !email || email.indexOf("@") < 1) {
      err.style.display = "block";
      return;
    }
    err.style.display = "none";

    var lines = [
      t("sumTitle"),
      "",
      t("sumWhen") + ": " + selDate.value + " " + selTime + t("sumDur"),
      t("sumName") + ": " + name,
      t("sumBiz") + ": " + biz,
      t("sumLink") + ": " + (link || "—"),
      t("sumEmail") + ": " + email,
      t("sumPain") + ": " + (pain || "—"),
      t("sumNote") + ": " + (note || "—")
    ];
    var body = lines.join("\n");
    var subject = t("mailSubject") + biz + " — " + selDate.value + " " + selTime;

    var submitBtn = document.querySelector("#form .submit");
    submitBtn.disabled = true;
    submitBtn.textContent = t("sending");

    function showDone(sent) {
      document.getElementById("form").style.display = "none";
      var done = document.getElementById("done");
      done.style.display = "block";
      document.getElementById("spots-n").textContent = Math.max(0, SPOTS_LEFT - 1);
      if (sent) {
        document.getElementById("done-msg").textContent = t("doneSent");
        document.getElementById("fallback").style.display = "none";
      } else {
        document.getElementById("done-msg").textContent = t("doneMail");
        document.getElementById("summary").value = body;
        document.getElementById("send-mail").dataset.href = "mailto:" + BOOKING_EMAIL +
          "?subject=" + encodeURIComponent(subject) +
          "&body=" + encodeURIComponent(body);
      }
      done.scrollIntoView({ behavior: "smooth", block: "start" });
    }

    var payload = {
      _subject: subject,
      _template: "table",
      _captcha: "false",
      slot: selDate.value + " " + selTime + " (60 min, JST)",
      name: name,
      business: biz,
      link: link || "-",
      email: email,
      pain_points: pain || "-",
      notes: note || "-",
      page_language: lang
    };

    var timeout = new Promise(function (_, rej) { setTimeout(rej, 8000); });
    Promise.race([
      fetch("https://formsubmit.co/ajax/" + BOOKING_EMAIL, {
        method: "POST",
        headers: { "Content-Type": "application/json", "Accept": "application/json" },
        body: JSON.stringify(payload)
      }),
      timeout
    ]).then(function (r) {
      if (!r || !r.ok) throw new Error("bad status");
      return r.json();
    }).then(function (data) {
      if (String(data.success) !== "true") throw new Error("relay refused");
      showDone(true);
    }).catch(function () {
      showDone(false);
    });
  });

  document.getElementById("send-mail").addEventListener("click", function () {
    if (this.dataset.href) location.href = this.dataset.href;
  });

  document.getElementById("copy").addEventListener("click", function () {
    var ta = document.getElementById("summary");
    ta.select();
    var self = this;
    try {
      navigator.clipboard ? navigator.clipboard.writeText(ta.value) : document.execCommand("copy");
      self.textContent = t("copied");
    } catch (e) {
      self.textContent = t("copyFail");
    }
  });

  function val(id) { return document.getElementById(id).value.trim(); }

  document.getElementById("spots-n").textContent = SPOTS_LEFT;
  applyLang();
})();
</script>
